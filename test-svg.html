<!DOCTYPE html>
<html>
<body>
<svg width="200" height="200">
  <g transform="scale(2)">
    <text y="20" style="font-size: 20px">Hello (style 20px)</text>
    <text y="40" font-size="20px">Hello (attr 20px)</text>
    <text y="60" font-size="20">Hello (attr 20)</text>
    <text y="80" style="font-size: calc(20px / 2)">Hello (calc 20px/2)</text>
  </g>
</svg>
</body>
</html>
