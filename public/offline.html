<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<title>Offline | FINRA Network Graph</title>
		<style>
			:root {
				color-scheme: light;
				--bg: #f5f0e4;
				--panel: rgba(255, 249, 239, 0.92);
				--ink: #101010;
				--muted: #5b5146;
				--accent: #f97316;
				--accent-2: #fb923c;
				--ring: rgba(249, 115, 22, 0.18);
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px;
				font-family:
					Inter,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
				background:
					radial-gradient(circle at top left, rgba(251, 146, 60, 0.22), transparent 34%), radial-gradient(circle at bottom right, rgba(239, 68, 68, 0.12), transparent 28%),
					var(--bg);
				color: var(--ink);
			}
			.card {
				width: min(100%, 640px);
				background: var(--panel);
				border: 1px solid rgba(16, 16, 16, 0.08);
				border-radius: 28px;
				padding: 32px;
				box-shadow: 0 20px 60px rgba(16, 16, 16, 0.08);
			}
			.badge {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				padding: 8px 14px;
				border-radius: 999px;
				background: var(--ring);
				color: var(--accent);
				font-size: 14px;
				font-weight: 700;
				letter-spacing: 0.02em;
				text-transform: uppercase;
			}
			h1 {
				margin: 18px 0 12px;
				font-size: clamp(2rem, 5vw, 3rem);
				line-height: 1.05;
			}
			p {
				margin: 0 0 14px;
				color: var(--muted);
				font-size: 1.05rem;
				line-height: 1.65;
			}
			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
				margin-top: 24px;
			}
			a,
			button {
				appearance: none;
				border: 0;
				border-radius: 999px;
				padding: 12px 18px;
				font: inherit;
				font-weight: 700;
				text-decoration: none;
				cursor: pointer;
			}
			.primary {
				background: linear-gradient(135deg, var(--accent), var(--accent-2));
				color: white;
			}
			.secondary {
				background: white;
				color: var(--ink);
				border: 1px solid rgba(16, 16, 16, 0.08);
			}
		</style>
	</head>
	<body>
		<main class="card">
			<div class="badge">Offline</div>
			<h1>You’re offline right now.</h1>
			<p> The FINRA Network Graph app shell is available, but live graph lookups and detail fetches need a network connection. </p>
			<p> Once you’re back online, refresh to reconnect to the server and Redis-backed API data. </p>
			<div class="actions">
				<button
					class="primary"
					onclick="window.location.reload()"
					>Try again</button
				>
				<a
					class="secondary"
					href="/"
					>Go to home</a
				>
			</div>
		</main>
	</body>
</html>
