<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#1e293b"/>
  <!-- Edges -->
  <line x1="16" y1="16" x2="7" y2="8"  stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="25" y2="8"  stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="7" y2="24" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="25" y2="24" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7"  y1="8"  x2="25" y2="8"  stroke="#3b82f6" stroke-width="1"   stroke-linecap="round" stroke-opacity="0.4"/>
  <line x1="7"  y1="24" x2="25" y2="24" stroke="#d97706" stroke-width="1"   stroke-linecap="round" stroke-opacity="0.4"/>
  <!-- Individual nodes (blue) -->
  <circle cx="7"  cy="8"  r="3" fill="#2563eb"/>
  <circle cx="25" cy="8"  r="3" fill="#2563eb"/>
  <!-- Firm nodes (amber) -->
  <circle cx="7"  cy="24" r="3" fill="#d97706"/>
  <circle cx="25" cy="24" r="3" fill="#d97706"/>
  <!-- Center hub -->
  <circle cx="16" cy="16" r="4" fill="#f8fafc"/>
</svg>
